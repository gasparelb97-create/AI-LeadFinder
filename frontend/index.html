<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trova clienti per AI</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 640px;
      margin: 20px auto;
      padding: 16px;
      background: #f1f5f9;
      color: #1e293b;
    }
    h1 { font-size: 26px; margin-bottom: 4px; }
    .intro { color: #475569; margin-bottom: 16px; }
    .box {
      background: white;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    label { display: block; font-weight: 600; margin-bottom: 6px; }
    input, select {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 16px;
      margin-bottom: 12px;
      box-sizing: border-box;
    }
    .presets {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }
    .preset {
      background: #e2e8f0;
      border: none;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 14px;
      cursor: pointer;
    }
    .preset.active { background: #2563eb; color: white; }
    button.main {
      width: 100%;
      background: #2563eb;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 8px;
    }
    button.secondary {
      width: 100%;
      background: #0ea5e9;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    .lead {
      background: #eff6ff;
      padding: 14px;
      border-radius: 12px;
      margin-bottom: 10px;
      border-left: 4px solid #2563eb;
    }
    .lead button {
      margin-top: 8px;
      padding: 8px 12px;
      font-size: 14px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      margin-right: 6px;
    }
    .btn-send { background: #16a34a; color: white; }
    .btn-status { background: #e2e8f0; }
    .btn-google { background: #0ea5e9; color: white; }
    .messaggio {
      background: #f8fafc;
      padding: 14px;
      border-radius: 12px;
      white-space: pre-wrap;
      font-size: 15px;
      line-height: 1.5;
    }
    .status-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 12px;
      margin-left: 8px;
    }
    .da-contattare { background: #fef3c7; color: #92400e; }
    .contattato { background: #dbeafe; color: #1e40af; }
    .visto { background: #fde68a; color: #92400e; }
    .risposto { background: #bbf7d0; color: #166534; }
  </style>
</head>
<body>
  <h1>Trova clienti</h1>
  <p class="intro">Scegli il tipo di attività e la zona. Ti mostro aziende e puoi preparare il messaggio da <strong>proggettoapp@gmail.com</strong>.</p>

  <div class="box">
    <label>Tipo di attività</label>
    <div class="presets" id="presets">
      <button class="preset active" data-val="pizzeria">Pizzeria</button>
      <button class="preset" data-val="bar">Bar</button>
      <button class="preset" data-val="ristorante">Ristorante</button>
      <button class="preset" data-val="negozio">Negozio</button>
      <button class="preset" data-val="agenzia">Agenzia</button>
      <button class="preset" data-val="studio professionale">Studio</button>
    </div>
    <input type="hidden" id="settore" value="pizzeria">

    <label>Zona</label>
    <input type="text" id="zona" value="Milano" placeholder="es. Roma, Napoli, Firenze">

    <button class="main" onclick="cerca()">Mostrami i clienti</button>
    <button class="secondary" onclick="cercaEmailGoogle()">Cerca email su Google</button>
  </div>

  <div id="risultati"></div>

  <div class="box" id="boxMessaggio" style="display:none;">
    <strong>Messaggio pronto</strong>
    <div class="messaggio" id="messaggio"></div>
    <p style="font-size:13px; color:#64748b; margin-top:8px;">Premi “Apri email” per aprire l’app di posta con il messaggio già scritto. Inserisci l’indirizzo del cliente e invia.</p>
  </div>

  <script>
    const presets = document.querySelectorAll('.preset');
    presets.forEach(btn => {
      btn.addEventListener('click', () => {
        presets.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('settore').value = btn.dataset.val;
      });
    });

    let leads = JSON.parse(localStorage.getItem('leads') || '[]');

    function cerca() {
      const settore = document.getElementById('settore').value;
      const zona = document.getElementById('zona').value || 'Italia';
      const risultati = document.getElementById('risultati');

      risultati.innerHTML = '<div class="box">Sto cercando...</div>';

      setTimeout(() => {
        const nuovi = [
          {
            id: Date.now() + 1,
            nome: settore.charAt(0).toUpperCase() + settore.slice(1) + ' Da Mario',
            zona,
            motivo: 'Ha molti clienti e attività ripetitive (ordini, messaggi, prenotazioni).',
            status: 'da-contattare'
          },
          {
            id: Date.now() + 2,
            nome: 'Il ' + settore.charAt(0).toUpperCase() + settore.slice(1) + ' del Centro',
            zona,
            motivo: 'Lavora tanto con il pubblico e potrebbe automatizzare risposte e promozioni.',
            status: 'da-contattare'
          }
        ];

        leads = [...nuovi, ...leads].slice(0, 20);
        localStorage.setItem('leads', JSON.stringify(leads));
        renderLeads();

        document.getElementById('boxMessaggio').style.display = 'block';
        aggiornaMessaggio(settore, zona);
      }, 600);
    }

    function cercaEmailGoogle() {
      const settore = document.getElementById('settore').value || 'attivita';
      const zona = document.getElementById('zona').value || 'Italia';
      const query = encodeURIComponent(`${settore} ${zona} email OR contatti OR "info@"`);
      window.open(`https://www.google.com/search?q=${query}`, '_blank');
    }

    function cercaEmailLead(nome, zona) {
      const query = encodeURIComponent(`"${nome}" ${zona} email OR contatti OR "info@" OR "@"`);
      window.open(`https://www.google.com/search?q=${query}`, '_blank');
    }

    function aggiornaMessaggio(settore, zona, nome = '') {
      const testo = `Ciao${nome ? ' ' + nome : ''},

ho visto che hai un ${settore} a ${zona}. Molte attività come la tua usano l'intelligenza artificiale per rispondere più velocemente ai clienti, gestire prenotazioni e creare promozioni.

Se ti interessa una soluzione semplice che ti fa risparmiare tempo ogni giorno, posso spiegarti in 2 minuti come funziona.

Fammi sapere se vuoi maggiori dettagli.

Grazie`;
      document.getElementById('messaggio').textContent = testo;
      return testo;
    }

    function renderLeads() {
      const risultati = document.getElementById('risultati');
      if (leads.length === 0) {
        risultati.innerHTML = '';
        return;
      }
      risultati.innerHTML = '<h3 style="margin:16px 0 8px;">Clienti trovati</h3>' +
        leads.map(l => `
          <div class="lead">
            <strong>${l.nome}</strong>
            <span class="status-badge ${l.status}">${statusLabel(l.status)}</span><br>
            Zona: ${l.zona}<br>
            <em>${l.motivo}</em><br>
            <button class="btn-google" onclick="cercaEmailLead('${l.nome.replace(/'/g, "\\'")}', '${l.zona}')">Cerca email</button>
            <button class="btn-send" onclick="apriEmail(${l.id})">Apri email</button>
            <button class="btn-status" onclick="cambiaStatus(${l.id}, 'contattato')">Contattato</button>
            <button class="btn-status" onclick="cambiaStatus(${l.id}, 'visto')">Ha visto</button>
            <button class="btn-status" onclick="cambiaStatus(${l.id}, 'risposto')">Ha risposto</button>
          </div>
        `).join('');
    }

    function statusLabel(s) {
      return {
        'da-contattare': 'Da contattare',
        'contattato': 'Contattato',
        'visto': 'Ha visto',
        'risposto': 'Ha risposto'
      }[s] || s;
    }

    function cambiaStatus(id, nuovo) {
      leads = leads.map(l => l.id === id ? { ...l, status: nuovo } : l);
      localStorage.setItem('leads', JSON.stringify(leads));
      renderLeads();
    }

    function apriEmail(id) {
      const lead = leads.find(l => l.id === id);
      if (!lead) return;
      const settore = document.getElementById('settore').value;
      const testo = aggiornaMessaggio(settore, lead.zona, lead.nome);
      const subject = encodeURIComponent('Proposta AI per ' + lead.nome);
      const body = encodeURIComponent(testo);
      window.location.href = `mailto:?subject=${subject}&body=${body}`;
      cambiaStatus(id, 'contattato');
    }

    renderLeads();
  </script>
</body>
</html>
